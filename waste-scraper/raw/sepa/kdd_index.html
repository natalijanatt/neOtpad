    <script type="text/javascript">
        var package_path = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));

        //var lokalizacija = 'null';

        //if (lokalizacija == "null") {
        //    lokalizacija = "sr";
        //}
        var dojoConfig = {
            parseOnLoad: true,
            async: true,
            cacheBust: true,
            extraLocale: ["en"],
            packages: [{
                name: "application",
                location: package_path + '/js'
            },
            {
                name: "dstore",
                location: package_path + '/js/dstore'
            },
            {
                name: "obv",
                location: package_path + '/naprave/napravaObavestenja'
            },
            {
                name: "pretraga",
                location: package_path + '/naprave/napravaPretrage'
            },
            {
                name: "statistika",
                location: package_path + '/naprave/napravaStatistike'
            },
            {
                name: "podloge",
                location: package_path + '/naprave/napravaPodloga'
            },
            {
                name: "sadrzaj",
                location: package_path + '/naprave/tocsad'
            },
            {
                name: "config",
                location: package_path + '/config'
            }]
        };
        var locale = getQueryVariable("locale");
        if (locale) {
            dojoConfig.locale = locale;
        } else {
            dojoConfig.locale = "sr";
        }
        function getQueryVariable(param) {
            var query = window.location.search.substring(1);
            var vars = query.split("&");
            for (var i = 0; i < vars.length; i++) {
                var pair = vars[i].split("=");
                if (pair[0] == param) {
                    return pair[1];
                }
            }
            return (false);
        }
    </script>
    <script type="text/javascript" src="https://js.arcgis.com/3.35/"></script>

    <script type="text/javascript">

            //parser.parse();
            var myApp = new Main();
            // start template
            myApp.startup();

        });
    </script>
