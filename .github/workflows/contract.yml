name: contract

# The same scripts the pre-commit hooks run, plus the one check that needs two
# revisions to make sense: whether the contract change is breaking.
#
# .claude/ hooks cover Claude Code sessions and lefthook covers local commits;
# this covers everything that reaches the remote regardless of how it got there.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: contract is generated and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npm test
        working-directory: backend

      # Regenerate and fail on any diff: the committed contract must be exactly
      # what this source produces. This is the same check as the pre-commit
      # guard, repeated here because hooks can be bypassed with --no-verify.
      - name: contract matches the source
        working-directory: backend
        run: |
          npm run openapi:generate
          if ! git diff --exit-code -- ../contracts/openapi.json ../contracts/package.json; then
            echo "::error::contracts/openapi.json is out of date. Run 'cd backend && npm run openapi:generate' and commit the result."
            exit 1
          fi

      - run: npm run contract:lint
        working-directory: backend

  frontend:
    name: client is generated and type-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: generated client matches the contract
        working-directory: frontend
        run: |
          npm run api:generate
          if ! git diff --exit-code -- src/api/generated; then
            echo "::error::src/api/generated is out of date. Run 'cd frontend && npm run api:generate' and commit the result."
            exit 1
          fi

      - run: npm run typecheck
        working-directory: frontend

  breaking-change:
    name: contract change is not breaking
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch the base contract
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git cat-file -e "origin/${{ github.base_ref }}:contracts/openapi.json" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:contracts/openapi.json" > base-openapi.json
            echo "base_exists=true" >> "$GITHUB_ENV"
          else
            echo "base_exists=false" >> "$GITHUB_ENV"
          fi

      # Additive changes (new endpoint, new optional field) pass. Removing a
      # field, changing a type, or making an existing field required fails,
      # because the frontend is being written against the old shape right now.
      #
      # To reproduce locally (needs Docker and access to Docker Hub):
      #   git show origin/main:contracts/openapi.json > base-openapi.json
      #   docker run --rm -v "$PWD:/specs:ro" tufin/oasdiff breaking \
      #     /specs/base-openapi.json /specs/contracts/openapi.json --fail-on ERR
      - name: oasdiff breaking
        if: env.base_exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.0.21
        with:
          base: base-openapi.json
          revision: contracts/openapi.json
          fail-on-diff: true

      - name: no base contract to compare against
        if: env.base_exists != 'true'
        run: echo "contracts/openapi.json does not exist on ${{ github.base_ref }} yet; nothing to compare."
